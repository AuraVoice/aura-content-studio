<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f5f8f7;
        --ink: #1a1a1a;
        --ink-2: #3f3f44;
        --teal: #1ec8b0;
        --teal-dark: #148474;
        --amber: #e8a020;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; }
      #bg { position: absolute; inset: 0; background: var(--ground); overflow: hidden; }
      .haze { position: absolute; border-radius: 50%; filter: blur(120px); }
      #haze-teal { width: 1000px; height: 1000px; left: -380px; top: -420px; background: rgba(30, 200, 176, 0.22); }
      #haze-amber { width: 900px; height: 900px; right: -360px; bottom: -380px; background: rgba(232, 160, 32, 0.12); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.6" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="19.6" data-track-index="0" data-layout-ignore>
        <div id="haze-teal" class="haze"></div>
        <div id="haze-amber" class="haze"></div>
      </div>

      <div id="phone" data-composition-id="phone" data-composition-src="compositions/phone.html"
        data-start="0" data-duration="16.45" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" data-variable-values='{"layout":"vertical"}'></div>

      <div id="copy" data-composition-id="copy" data-composition-src="compositions/copy.html"
        data-start="0" data-duration="16.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" data-variable-values='{"layout":"vertical"}'></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="16.45" data-duration="3.15" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" data-variable-values='{"layout":"vertical"}'></div>

      <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="19.6"
        data-track-index="4" data-volume="0.8" data-fade-in="0.2" data-fade-out="1.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#haze-teal", { x: 0, y: 0 }, { x: 140, y: 60, duration: 19.6, ease: "none" }, 0);
      tl.fromTo("#haze-amber", { x: 0, y: 0 }, { x: -120, y: -40, duration: 19.6, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
